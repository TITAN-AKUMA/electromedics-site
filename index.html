<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectroMedics</title>
  <link rel="icon" href="electromedics_background.png">
  <style>
    body {
      font-family: Arial, sans-serif;
      /* New balanced gradient */
      background: radial-gradient(circle at top, #1b2735, #090a0f);
      color: #eaeaea;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Subtle animated gradient glow */
    body::before {
      content: "";
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, #007BFF22, #00FF8822, #007BFF22);
      animation: rotate 20s linear infinite;
      z-index: -1;
      opacity: 0.2;
    }

    @keyframes rotate {
      100% {
        transform: rotate(360deg);
      }
    }

    /* Navbar */
    nav {
      background: linear-gradient(90deg, #0f0f1e, #0d213a);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 8%;
      box-shadow: 0 2px 12px rgba(0,255,136,0.2);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-section h1 {
      text-shadow: 0 0 6px #00FF8844;
    }

    .logo-section img {
      width: 40px;
      height: auto;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: #f0f0f0;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #00FF88;
      text-shadow: 0 0 8px #00FF88;
    }

    /* Sidebar (mobile) */
    .sidebar {
      position: fixed;
      top: 0;
      left: -260px;
      width: 240px;
      height: 100%;
      background: rgba(20, 20, 30, 0.95);
      backdrop-filter: blur(10px);
      border-right: 2px solid rgba(0,255,136,0.3);
      box-shadow: 4px 0 20px rgba(0, 255, 136, 0.15);
      padding-top: 80px;
      transition: 0.3s;
      z-index: 999;
    }

    .sidebar.active {
      left: 0;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar ul li {
      margin: 25px 0;
      text-align: center;
    }

    .sidebar ul li a {
      color: #dcdcdc;
      text-decoration: none;
      font-size: 18px;
      transition: 0.3s;
    }

    .sidebar ul li a:hover {
      color: #00FF88;
      text-shadow: 0 0 10px #00FF88;
    }

    /* Hamburger icon */
    .menu-toggle {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
    }

    .menu-toggle div {
      width: 25px;
      height: 3px;
      background: white;
      border-radius: 3px;
    }

    /* Section */
    section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }

    section h2 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      text-shadow: 0 0 8px rgba(0,255,136,0.3);
    }

    section p {
      max-width: 600px;
      font-size: 1.1rem;
      line-height: 1.6;
      color: #c9c9c9;
    }

    /* Responsive */
    @media screen and (max-width: 900px) {
      .nav-links {
        display: none;
      }
      .menu-toggle {
        display: flex;
      }
    }

    @media screen and (max-width: 768px) {
      body {
        flex-direction: column;
      }
      section {
        flex: 1;
        padding: 40px 20px;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav>
    <div class="logo-section">
      <img src="electromedics_background.png" alt="Logo">
      <h1>ElectroMedics</h1>
    </div>

    <div class="nav-links">
      <a href="index.html">HOME</a>
      <a href="about.html">ABOUT US</a>
      <a href="projects.html">PROJECTS</a>
      <a href="media.html">MEDIA</a>
      <a href="join.html">JOIN US</a>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </nav>

  <!-- Sidebar (Mobile) -->
  <div class="sidebar" id="sidebar">
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li><a href="about.html">ABOUT US</a></li>
      <li><a href="projects.html">PROJECTS</a></li>
      <li><a href="media.html">MEDIA</a></li>
      <li><a href="join.html">JOIN US</a></li>
    </ul>
  </div>

  <!-- Content -->
  <section>
    <div>
      <h2>Welcome to ElectroMedics</h2>
      <p>
        Shaping the future with innovation, creativity, and technology.  
        Explore our projects and join us in building something beyond imagination.
      </p>
    </div>
  </section>

  <script>
    function toggleMenu() {
      document.getElementById("sidebar").classList.toggle("active");
    }
  </script>
</body>
</html>
