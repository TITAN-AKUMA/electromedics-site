<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectroMedics</title>
  <link rel="icon" href="electromedics_background.png">
  <style>
    *{
      cursor: default;
    }
    body {
      font-family: Arial, sans-serif;
      background: #000814; /* Desktop floating orb background reference */
      color: #eaeaea;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 🌌 Floating Orb Background for desktop */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle at 20% 30%, #00ff8844 0%, transparent 40%),
                  radial-gradient(circle at 80% 70%, #007bff44 0%, transparent 35%),
                  radial-gradient(circle at 50% 50%, #00ffaa22 0%, transparent 45%);
      animation: moveOrbs 18s ease-in-out infinite alternate;
      z-index: -1;
    }

    @keyframes moveOrbs {
      0% { background-position: 0% 0%, 100% 100%, 50% 50%; }
      50% { background-position: 50% 20%, 50% 80%, 60% 40%; }
      100% { background-position: 100% 0%, 0% 100%, 40% 60%; }
    }

    nav {
      background: linear-gradient(90deg, #0f0f1e, #0d213a);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 8%;
      box-shadow: 0 2px 12px rgba(0,255,136,0.2);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-section h1 { text-shadow: 0 0 6px #00FF8844; }

    .logo-section img { width: 40px; height: auto; }

    .nav-links {
      display: flex;
      gap: 20px;
      cursor: pointer;
    }

    .nav-links a {
      color: #f0f0f0;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
      cursor: pointer;
    }

    .nav-links a:hover { color: #00FF88; text-shadow: 0 0 8px #00FF88;cursor: pointer; }

    .sidebar {
      position: fixed;
      top: 0;
      left: -260px;
      width: 240px;
      height: 100%;
      background: rgba(20, 20, 30, 0.95);
      backdrop-filter: blur(10px);
      border-right: 2px solid rgba(0,255,136,0.3);
      box-shadow: 4px 0 20px rgba(0, 255, 136, 0.15);
      padding-top: 80px;
      transition: 0.4s ease-in-out;
      z-index: 999;
    }

    .sidebar.active { left: 0; }

    .sidebar ul { list-style: none; padding: 0; }

    .sidebar ul li { margin: 25px 0; text-align: center; }

    .sidebar ul li a {
      color: #dcdcdc;
      text-decoration: none;
      font-size: 18px;
      transition: 0.3s;
    }

    .sidebar ul li a:hover { color: #00FF88; text-shadow: 0 0 10px #00FF88; }

    .menu-toggle {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
    }

    .menu-toggle div { width: 25px; height: 3px; background: white; border-radius: 3px; }

    section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }

    section h2 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      text-shadow: 0 0 8px rgba(0,255,136,0.3);
    }

    section p {
      max-width: 600px;
      font-size: 1.1rem;
      line-height: 1.6;
      color: #c9c9c9;
    }

    /* 🔥 Mobile-only animations remain same */
    @media screen and (max-width: 900px) {
      body::before { display: none; } /* Disable desktop orbs on mobile */
      .nav-links { display: none; }
      .menu-toggle { display: flex; }

      body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, #00ff8844 5%, transparent 30%),
                    radial-gradient(circle, #007bff44 5%, transparent 30%);
        background-size: 200px 200px;
        animation: moveBackground 15s linear infinite;
        z-index: -2;
      }

      @keyframes moveBackground {
        0% { background-position: 0 0, 100% 100%; }
        50% { background-position: 100% 0, 0 100%; }
        100% { background-position: 0 0, 100% 100%; }
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo-section">
      <img src="electromedics_background.png" alt="Logo">
      <h1>ElectroMedics</h1>
    </div>

    <div class="nav-links">
      <a href="index.html">HOME</a>
      <a href="about.html">ABOUT US</a>
      <a href="projects.html">PROJECTS</a>
      <a href="media.html">MEDIA</a>
      <a href="join.html">JOIN US</a>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </nav>

  <div class="sidebar" id="sidebar">
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li><a href="about.html">ABOUT US</a></li>
      <li><a href="projects.html">PROJECTS</a></li>
      <li><a href="media.html">MEDIA</a></li>
      <li><a href="join.html">JOIN US</a></li>
    </ul>
  </div>

  <section>
    <div>
      <h2>Welcome to ElectroMedics</h2>
      <p>Shaping the future with innovation, creativity, and technology.  
         Explore our projects and join us in building something beyond imagination.</p>
    </div>
  </section>

  <script>
    const sidebar = document.getElementById("sidebar");
    let startX = 0, endX = 0;

    function toggleMenu(force) {
      if (force === "open") sidebar.classList.add("active");
      else if (force === "close") sidebar.classList.remove("active");
      else sidebar.classList.toggle("active");
    }

    document.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; });
    document.addEventListener("touchend", (e) => {
      endX = e.changedTouches[0].clientX;
      let diffX = endX - startX;
      if (diffX > 80 && !sidebar.classList.contains("active")) toggleMenu("open");
      if (diffX < -80 && sidebar.classList.contains("active")) toggleMenu("close");
    });
  </script>
</body>
</html>
